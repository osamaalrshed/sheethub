# nginx config for portable Windows setup.
# All services run on 127.0.0.1 instead of Docker container names.

worker_processes 1;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/html text/css text/plain text/xml
               application/javascript application/json
               application/xml application/xml+rss
               image/svg+xml;
    gzip_comp_level 5;

    server {
        listen 8181;
        client_max_body_size 50m;

        # Block public shared view URLs
        location ~* ^/nc/view/ {
            return 403 "Sharing is disabled.";
        }

        # Serve custom CSS and admin-detector JS from this folder
        location = /nocodb-custom.css {
            alias conf/custom.css;
            add_header Content-Type "text/css";
        }
        location = /nocodb-admin-detector.js {
            alias conf/admin-detector.js;
            add_header Content-Type "application/javascript";
        }

        location / {
            proxy_pass         http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-Host $http_host;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Port $server_port;
            proxy_set_header   Accept-Encoding "";
            proxy_cache_bypass $http_upgrade;

            sub_filter '</head>' '<link rel="stylesheet" href="/nocodb-custom.css"></head>';
            sub_filter '</body>' '<script src="/nocodb-admin-detector.js"></script></body>';
            sub_filter_once on;
            sub_filter_types text/html;
        }
    }
}
