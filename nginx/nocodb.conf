# ── Single server: CSS hides + admin-detector JS injected into every page ───
server {
    listen 80;

    client_max_body_size 50m;

    # Compress nginx output to the client (NocoDB sends uncompressed because
    # we strip Accept-Encoding so sub_filter can modify HTML — re-compress here
    # so the browser still downloads compressed bytes).
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/html text/css text/plain text/xml
               application/javascript application/json
               application/xml application/xml+rss
               image/svg+xml;
    gzip_comp_level 5;

    # Block public shared view URLs at network level
    location ~* ^/nc/view/ {
        return 403 "Sharing is disabled.";
    }

    # Serve the custom CSS and admin-detector JS from local files
    location = /nocodb-custom.css {
        alias /etc/nginx/custom.css;
        add_header Content-Type "text/css";
    }
    location = /nocodb-admin-detector.js {
        alias /etc/nginx/admin-detector.js;
        add_header Content-Type "application/javascript";
    }

    location / {
        proxy_pass         http://nocodb:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Host $http_host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port $server_port;
        proxy_set_header   Accept-Encoding "";
        proxy_cache_bypass $http_upgrade;

        # Inject <link> (CSS) before </head> and <script> before </body>.
        sub_filter '</head>' '<link rel="stylesheet" href="/nocodb-custom.css"></head>';
        sub_filter '</body>' '<script src="/nocodb-admin-detector.js"></script></body>';
        sub_filter_once on;
        sub_filter_types text/html;
    }
}
