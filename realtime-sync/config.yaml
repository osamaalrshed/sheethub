# Tables to sync from source schemas -> analytics schema (incremental).
tables:
  - finance.cost_centers
  - finance.budget_targets
  - sales.regional_targets
  - sales.partner_commissions
  - operations.vendor_master
  - operations.maintenance_schedules

# How often to check audit.change_log for new changes (seconds)
poll_seconds: 2.0

# Destination schema in PostgreSQL
destination_schema: analytics
